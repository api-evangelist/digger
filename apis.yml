aid: digger
name: Digger
description: >-
  Digger (diggerhq), backed by Initialized Capital, builds developer
  infrastructure across two open-source-rooted product lines. OpenTaco (formerly
  the Digger CE project) is an Infrastructure-as-Code orchestration and
  Terraform/OpenTofu state-management platform that runs plan/apply inside your
  existing CI pipeline, with PR automation, PR-level locks, drift detection and
  remediation, RBAC via Open Policy Agent, and FIPS 140 support; it is
  self-hostable via Docker Compose, Railway, and Kubernetes. OpenComputer is
  the company's flagship agent-infrastructure product: persistent, long-running
  cloud VMs for AI agents — real Linux machines that hibernate when idle and
  wake in seconds, with checkpoints, preview URLs, per-tenant package control,
  a REST API, TypeScript and Python SDKs, the oc CLI, durable agent sessions,
  and signed, retriable webhooks for sandbox lifecycle events.
