apis:
- name: OpenComputer API
  description: >-
    REST API for OpenComputer — create and manage persistent cloud sandbox VMs,
    run commands and files inside them, checkpoint/fork, expose preview URLs,
    run durable agent sessions, and register signed webhooks for sandbox
    lifecycle events. Management calls authenticate with an org API key via the
    X-API-Key header (Bearer on the v3 sessions surface); short-lived,
    session-scoped client tokens (read/steer) are safe for browsers.
